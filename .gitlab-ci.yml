# EVERYTHING BELOW, EXCEPT SYSAND_INDEX_URL WHICH SHOULD BE DECLARED TO
# https://sysand.com, SHOULD BE KEPT IN SYNC WITH EXAMPLES PROVIDED FOR
# SYSAND-INDEX DOCS.
# ----------------------------------------------------------------------------
# This is a GitLab pipeline configuration, defining a set of jobs grouped into
# stages.
#
# The pipeline will run when a git tag like v1.2.3 is pushed, and publish a
# release to the chosen sysand index using trusted publishing.
#
# The image used includes Rust and Cargo so sysand can be installed from source.
# The installed sysand binary is cached by source commit.
#
# trusted publishing reference: https://docs.sysand.com/index/tutorials/setting-up-trusted-publishing
# pipeline config reference:    https://docs.gitlab.com/ci/yaml/
# rust image reference:         https://hub.docker.com/_/rust
#
workflow:
  rules:
    - if: $CI_COMMIT_TAG

variables:
  SYSAND_INDEX_URL: https://staging.sysand.com

default:
  image: rust:latest
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates cmake git && rm -rf /var/lib/apt/lists/*
  cache:
    key: sysand-${SYSAND_COMMIT_SHA}
    paths:
      - .cargo-bin/

stages:
  - resolve
  - test
  - publish

resolve-sysand-commit:
  stage: resolve
  image: alpine:latest
  before_script: []
  cache: []
  script:
    - apk add --no-cache git
    - echo "SYSAND_COMMIT_SHA=$(git ls-remote https://github.com/consideratio/sysand.git HEAD | cut -f1)" >> build.env
  artifacts:
    reports:
      dotenv: build.env

test:
  stage: test
  needs:
    - resolve-sysand-commit
  script:
    # install sysand from source, reusing a cache keyed by the source commit
    - |
      if [ -f .cargo-bin/sysand ]; then
        install -m 0755 .cargo-bin/sysand /usr/local/bin/sysand
      else
        cargo install --git https://github.com/consideratio/sysand.git sysand --locked
        mkdir -p .cargo-bin
        cp "${CARGO_HOME}/bin/sysand" .cargo-bin/sysand
      fi

    # check version in git tag matches the project's declared version
    - |
      PROJECT_VERSION="$(sysand info version)"
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
        echo "Project version ${PROJECT_VERSION} does not match tag ${CI_COMMIT_TAG}"
        exit 1
      fi

publish:
  stage: publish
  needs:
    - resolve-sysand-commit
  environment:
    name: sysand
    url: https://sysand.com
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sysand
  script:
    # install sysand from source, reusing a cache keyed by the source commit
    - |
      if [ -f .cargo-bin/sysand ]; then
        install -m 0755 .cargo-bin/sysand /usr/local/bin/sysand
      else
        cargo install --git https://github.com/consideratio/sysand.git sysand --locked
        mkdir -p .cargo-bin
        cp "${CARGO_HOME}/bin/sysand" .cargo-bin/sysand
      fi

    # build and publish a project to the index
    - |
      sysand build
      sysand publish --index "${SYSAND_INDEX_URL}"
