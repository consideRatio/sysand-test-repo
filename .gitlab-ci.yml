stages:
  - resolve
  - publish

resolve-sysand-commit:
  stage: resolve
  image: alpine:latest
  script:
    - apk add --no-cache git
    - echo "SYSAND_COMMIT_SHA=$(git ls-remote https://github.com/consideratio/sysand.git publish | cut -f1)" >> build.env
  artifacts:
    reports:
      dotenv: build.env

publish-dev:
  stage: publish
  image: rust:latest
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sysand
  needs:
    - resolve-sysand-commit
  cache:
    key: sysand-${SYSAND_COMMIT_SHA}
    paths:
      - .cargo-bin/
  script:
    # install latest sysand
    - |
      ARCH=$(uname -m | sed 's/aarch64/arm64/')
      curl -fsSL "https://github.com/sensmetry/sysand/releases/latest/download/sysand-linux-${ARCH}" \
        -o /usr/local/bin/sysand
      chmod +x /usr/local/bin/sysand

      sysand --version

    # install cached dev version
    - |
      if [ -f .cargo-bin/sysand ]; then
        cp .cargo-bin/sysand /usr/local/bin/sysand
      else
        cargo install sysand --git=https://github.com/consideratio/sysand.git --branch=publish
        mkdir -p .cargo-bin
        cp $CARGO_HOME/bin/sysand .cargo-bin/sysand
      fi

    # acquire and configure sysand index credentials
    - |
      TOKEN=$(
        curl -s -X POST https://sysand-index-alpha.syside.app/api/v1/oidc/token \
          -H "Content-Type: application/json" \
          -d "{\"token\": \"${GITLAB_OIDC_TOKEN}\"}" \
        | grep -o '"token": *"[^"]*"' \
        | cut -d'"' -f4 \
      )
      export SYSAND_CRED_X='https://sysand-index-alpha.syside.app/api/v1/**'
      export SYSAND_CRED_X_BEARER_TOKEN="$TOKEN"

    - sysand --version

    - |
      sysand init --publisher Admin --name proj0 --license MIT --version "2.0.$(date +%s)"
      cat > README.md << 'READMEEOF'
      # Project README

      This is a Markdown `test` string used to verify `sysand` packaging.
      READMEEOF
      sysand build
      sysand publish --index https://sysand-index-alpha.syside.app
