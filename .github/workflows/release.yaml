# EVERYTHING BELOW, EXCEPT SYSAND_INDEX_URL WHICH SHOULD BE DECLARED TO
# https://sysand.com, SHOULD BE KEPT IN SYNC WITH EXAMPLES PROVIDED FOR
# SYSAND-INDEX DOCS.
# ----------------------------------------------------------------------------
# This is a GitHub workflow, defining a set of jobs each with a set of steps.
#
# The workflow will run when a git tag like v1.2.3 is pushed, and publish a
# release to the chosen sysand index using trusted publishing.
#
# trusted publishing reference:  https://docs.sysand.com/index/tutorials/setting-up-trusted-publishing
# workflow config reference:     https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# workflow cache reference:      https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
#
name: Release

on:
  push:
    tags: ["v*"]

env:
  SYSAND_INDEX_URL: https://staging.sysand.com

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Resolve sysand source commit
        id: sysand_commit
        run: |
          echo "sha=$(git ls-remote https://github.com/consideratio/sysand.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache sysand install
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/sysand
          key: sysand-${{ runner.os }}-${{ steps.sysand_commit.outputs.sha }}

      - name: Install Rust
        if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install sysand
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/consideratio/sysand.git sysand --locked

      - name: Check version in git tag matches the project's declared version
        run: |
          PROJECT_VERSION="$(sysand info version)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "Project version ${PROJECT_VERSION} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

  publish:
    runs-on: ubuntu-latest
    needs: [test]
    environment: sysand
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve sysand source commit
        id: sysand_commit
        run: |
          echo "sha=$(git ls-remote https://github.com/consideratio/sysand.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache sysand install
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/sysand
          key: sysand-${{ runner.os }}-${{ steps.sysand_commit.outputs.sha }}

      - name: Install Rust
        if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install sysand
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/consideratio/sysand.git sysand --locked

      - name: Build and publish a project to the index
        run: |
          sysand build
          sysand publish --index "${SYSAND_INDEX_URL}"
