name: Release

on:
  push:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install sysand
        run: |
          ARCH=$(uname -m | sed 's/aarch64/arm64/')
          SYSAND_VERSION=$(
            curl -fsSL https://api.github.com/repos/sensmetry/sysand/releases \
              | awk -F'"' '/"tag_name":/ { tag=$4 } /"prerelease": true/ { print tag; exit }'
          )
          test -n "$SYSAND_VERSION"
          SYSAND_ARCHIVE="sysand-linux-${ARCH}.tar.xz"
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          curl -fsSL "https://github.com/sensmetry/sysand/releases/download/${SYSAND_VERSION}/${SYSAND_ARCHIVE}" \
            -o "$TMPDIR/${SYSAND_ARCHIVE}"
          tar -xJf "$TMPDIR/${SYSAND_ARCHIVE}" -C "$TMPDIR"
          install -m 0755 "$TMPDIR/sysand" /usr/local/bin/sysand
          sysand --version

      - name: Acquire and configure sysand index credentials
        run: |
          GITHUB_OIDC_TOKEN=$(
            curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sysand" \
            | grep -o '"value": *"[^"]*"' \
            | cut -d'"' -f4 \
          )
          SYSAND_INDEX_TOKEN=$(
            curl -s -X POST https://staging.sysand.com/api/v1/oidc/token \
              -H "Content-Type: application/json" \
              -d "{\"token\": \"${GITHUB_OIDC_TOKEN}\"}" \
            | grep -o '"token": *"[^"]*"' \
            | cut -d'"' -f4 \
          )
          echo 'SYSAND_CRED_X=https://staging.sysand.com/api/v1/**' >> "$GITHUB_ENV"
          echo "SYSAND_CRED_X_BEARER_TOKEN=$SYSAND_INDEX_TOKEN" >> "$GITHUB_ENV"

      - name: initialize dummy project
        run: |
          sysand init --publisher Admin --name proj0 --license MIT --version "2.0.$(date +%s)"

          cat > README.md << 'EOF'
          # Project README

          This is a Markdown `test` string used to verify `sysand` packaging.
          EOF

          mkdir LICENSES
          cat > LICENSES/MIT.txt << 'EOF'
          MIT License

          Dummy content.
          EOF

      - name: Build and publish a project to the index
        run: |
          sysand build
          sysand publish --index https://staging.sysand.com
