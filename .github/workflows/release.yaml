# EVERYTHING BELOW, EXCEPT SYSAND_INDEX_URL WHICH SHOULD BE DECLARED TO
# https://sysand.com, SHOULD BE KEPT IN SYNC WITH EXAMPLES PROVIDED FOR
# SYSAND-INDEX DOCS.
# ----------------------------------------------------------------------------
# This is a GitHub workflow, defining a set of jobs each with a set of steps.
#
# The workflow will run when a git tag like v1.2.3 is pushed, and publish a
# release to the chosen sysand index using trusted publishing.
#
# trusted publishing reference:  https://docs.sysand.com/index/tutorials/setting-up-trusted-publishing
# workflow config reference:     https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# installation script reference: https://docs.sysand.com/client/getting-started/installation#macos-and-linux
#
name: Release

on:
  push:
    tags: ["v*"]

env:
  SYSAND_INDEX_URL: https://staging.sysand.com

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install sysand
        run: |
          curl -fsSL https://sysand.com/install.sh | sh -s -- --version latest

      - name: Check version in git tag matches the project's declared version
        run: |
          PROJECT_VERSION="$(sysand info version)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "Project version ${PROJECT_VERSION} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

  publish:
    runs-on: ubuntu-latest
    needs: [test]
    environment: sysand
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install sysand
        run: |
          curl -fsSL https://sysand.com/install.sh | sh -s -- --version latest

      - name: Acquire and configure sysand index credentials
        run: |
          GITHUB_OIDC_TOKEN=$(
            curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sysand" \
            | grep -o '"value": *"[^"]*"' \
            | cut -d'"' -f4 \
          )
          TOKEN_EXCHANGE_RESPONSE=$(
            curl -sS -X POST "${SYSAND_INDEX_URL}/api/v1/oidc/token" \
              -H "Content-Type: application/json" \
              -d "{\"token\": \"${GITHUB_OIDC_TOKEN}\"}" \
          )
          SYSAND_INDEX_TOKEN=$(
            printf '%s' "$TOKEN_EXCHANGE_RESPONSE" \
            | grep -o '"token": *"[^"]*"' \
            | cut -d'"' -f4 \
          )
          if [ -z "$SYSAND_INDEX_TOKEN" ]; then
            echo "Sysand Index token exchange failed: ${TOKEN_EXCHANGE_RESPONSE}"
            exit 1
          fi
          echo "SYSAND_CRED_X=${SYSAND_INDEX_URL}/api/v1/**" >> "$GITHUB_ENV"
          echo "SYSAND_CRED_X_BEARER_TOKEN=$SYSAND_INDEX_TOKEN" >> "$GITHUB_ENV"

      - name: Build and publish a project to the index
        run: |
          sysand build
          sysand publish --index "${SYSAND_INDEX_URL}"
