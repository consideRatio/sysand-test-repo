name: Release

on:
  push:

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for trusted publishing to sysand index
    steps:
      - uses: actions/checkout@v6

      - name: Resolve sysand publish branch commit
        id: sysand_commit
        run: |
          echo "sha=$(git ls-remote https://github.com/consideratio/sysand.git publish | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache sysand cargo install
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/sysand
          key: sysand-${{ runner.os }}-${{ steps.sysand_commit.outputs.sha }}
      - name: Install sysand CLI
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo install sysand --git=https://github.com/consideratio/sysand.git --branch=publish

      - name: Get GitHub token
        id: github_token
        run: |
          TOKEN=$(
            curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sysand" \
            | grep -o '"value": *"[^"]*"' \
            | cut -d'"' -f4 \
          )
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Exchange GitHub token for Sysand index token
        id: sysand_token
        run: |
          TOKEN=$(
            curl -s -X POST https://sysand-index-alpha.syside.app/api/v1/oidc/token \
              -H "Content-Type: application/json" \
              -d "{\"token\": \"${{ steps.github_token.outputs.token }}\"}" \
            | grep -o '"token": *"[^"]*"' \
            | cut -d'"' -f4 \
          )
          echo 'SYSAND_CRED_X=https://sysand-index-alpha.syside.app/api/v1/**' >> "$GITHUB_ENV"
          echo "SYSAND_CRED_X_BEARER_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - run: sysand --version

      - name: sysand publish
        run: |
          sysand init --publisher Admin --name proj0 --version "2.0.$(date +%s)"
          cat > README.md << 'READMEEOF'
          # Project README

          This is a Markdown `test` string used to verify `sysand` packaging.
          READMEEOF
          sysand build
          sysand publish --index https://sysand-index-alpha.syside.app

  publish-latest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install sysand
        run: |
          ARCH=$(uname -m | sed 's/aarch64/arm64/')
          curl -fsSL "https://github.com/sensmetry/sysand/releases/latest/download/sysand-linux-${ARCH}" \
            -o /usr/local/bin/sysand
          chmod +x /usr/local/bin/sysand
          sysand --version

      - name: Acquire and configure sysand index credentials
        run: |
          GITHUB_OIDC_TOKEN=$(
            curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sysand" \
            | grep -o '"value": *"[^"]*"' \
            | cut -d'"' -f4 \
          )
          SYSAND_INDEX_TOKEN=$(
            curl -s -X POST https://sysand-index-alpha.syside.app/api/v1/oidc/token \
              -H "Content-Type: application/json" \
              -d "{\"token\": \"${GITHUB_OIDC_TOKEN}\"}" \
            | grep -o '"token": *"[^"]*"' \
            | cut -d'"' -f4 \
          )
          echo 'SYSAND_CRED_X=https://sysand-index-alpha.syside.app/api/v1/**' >> "$GITHUB_ENV"
          echo "SYSAND_CRED_X_BEARER_TOKEN=$SYSAND_INDEX_TOKEN" >> "$GITHUB_ENV"

      - name: Build and publish a project to the index
        run: |
          sysand init --publisher Admin --name proj0 --version "2.0.$(date +%s)"
          cat > README.md << 'READMEEOF'
          # Project README

          This is a Markdown `test` string used to verify `sysand` packaging.
          READMEEOF
          sysand build
          sysand publish --index https://sysand-index-alpha.syside.app
